name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use npm ci (flat node_modules). Deno's symlink layout + Vite/Rollup hangs on Windows CI.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: get tag message
        id: tag_info
        run: |
          MSG=$(git tag -l --format='%(contents:subject)' ${{ github.ref_name }})
          echo "tag_msg=$MSG" >> $GITHUB_OUTPUT

      - name: install frontend dependencies
        run: npm ci

      - name: build frontend
        run: npm run build

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: .
          args: --config src-tauri/tauri.ci.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Hiphup-Terminal ${{ github.ref_name }}: ${{ steps.tag_info.outputs.tag_msg }}"
          releaseDraft: true
          prerelease: false
          includeRelease: true
